<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HearingHistoryLab</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:20px;line-height:1.55;background:#fff;color:#111;margin:0;padding:0}
#app{max-width:780px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:34px;margin:0 0 12px}
h2{font-size:26px;margin:26px 0 10px}
p{margin:10px 0}
button{font-size:20px;padding:14px 20px;margin:8px 6px 8px 0;cursor:pointer;border:2px solid #111;background:#fff;color:#111;border-radius:10px;touch-action:manipulation}
button.primary{background:#111;color:#fff}
button.quiet{font-size:16px;padding:9px 12px;border-color:#888;color:#444;border-width:1px}

input[type=range]{width:100%;height:52px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.cell{min-height:100px;height:124px;font-size:22px;border:3px solid #111;border-radius:12px;background:#f4f4f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation}
.cell:active{background:#ddd}
.cell.picked{border-color:#1a7f1a;background:#e9f7e9}
.pickmark{color:#1a7f1a;font-weight:700}
.dots{font-size:30px;letter-spacing:10px;line-height:1}
.muted{color:#555;font-size:18px}
.small{font-size:17px;color:#444}
.flag{background:#fff3cd;border:2px solid #7a5b00;padding:12px 14px;border-radius:10px;margin:14px 0}
.card{border:2px solid #111;border-radius:12px;padding:14px 16px;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:18px;margin:10px 0}
th,td{border:1px solid #999;padding:8px 10px;text-align:left}
th{background:#eee}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:20px}
select{font-size:20px;padding:10px}
.sliderLabels{display:flex;justify-content:space-between;font-size:18px;color:#333;margin:2px 2px 10px}
.progress{font-size:17px;color:#555;margin:6px 0}
.topbar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid #ddd}
.topbar.single{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
#sessPrev,#sessNext{touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.brand{font-size:15px;font-weight:700;color:#333;white-space:nowrap}
.topsub{font-size:16px;color:#444}
.spkbtn{position:relative;display:inline-block;cursor:pointer;touch-action:manipulation;border:3px solid #111;border-radius:50%;width:66px;height:66px;line-height:62px;text-align:center;background:#fff}
.spkbtn .spk{color:#cfcfcf;vertical-align:middle}
.spkbtn .spk.on{color:#111}
.replaybadge{position:absolute;right:-8px;bottom:-8px;background:#fff;border:2px solid #111;border-radius:50%;width:26px;height:26px;font-size:17px;line-height:23px;text-align:center;color:#111}

.bandpick label{border:2px solid #111;border-radius:10px;padding:10px;font-size:18px;display:flex;gap:8px;align-items:center;cursor:pointer}
.bandpick label.off{opacity:.45;border-style:dashed}
.bandpick input{width:22px;height:22px}
svg text{font-size:12px}
a{color:#0b4bcc}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   CONFIG — every tunable number lives here, named.
   ============================================================ */
const CONFIG = {
  BANDS_HZ: [250, 500, 1000, 2000, 4000, 8000, 12000, 16000, 20000],
  MIN_DB: -80,
  MAX_DB: 0,
  MAX_GAIN: 0.5,
  BEEP_DUR_MS: 250,
  RAMP_MS: 25,
  GAP_MS: 300,
  LONG_TONE_MS: 800,
  SPEECH_START_TIMEOUT_MS: 2000,
  SPEECH_VOICES_WAIT_MS: 1500,
  SLIDER_START_DB: -80,
  START_MARGIN_DB: 16,
  RETURN_START_PERCENT: 90,
  RETURN_CHECK_BAND_HZ: 1000,
  RETURN_CHECK_TOLERANCE_DB: 10,
  RETURN_CHECK_COMPARE_PERCENT: 50,
  TEACHING_TRIALS: 1,
  STEP_DOWN_INITIAL_DB: 8,
  MAX_OPENING_DIVES: 2,
  STEP_DOWN_FIRST_DB: 4,
  STEP_DOWN_DB: 2,
  STEP_UP_DB: 6,
  FITTER_AVOID_REPEAT: true,
  FITTER_SERVO: true,
  STEP_SCALES: [1, 0.5],
  TRANSITION_MISSES: 2,
  PLACEMENT_PERCENT: 70,
  PLACEMENT_STARVED_PERCENT: 60,
  FITTER_ROUND_DB: 0.1,
  FITTER_TRIALS: 8,
  MAX_TRIALS_PER_TRACK: 30,
  GUESS_RATE: 0.25,
  LAPSE_RATE: 0.05,
  EAR_BLOCK: 6,
  RUN_CAP: 3,
  RETRY_REMIND_AFTER: 3,
  SKIP_HINT_SKIPS: 2,
  SKIP_HINT_EASIER_DB: 2,
  GRID_S_VALUES: [1.5, 2.5, 4, 6, 9],
  GRID_T_EXTEND_DB: 6,
  GRID_T_STEP_DB: 1,
  THRESHOLD_PERCENT: 75,
  NOT_HEARD_CONSEC_WRONG_EAR_AT_MAX: 3,
  CONTINUE_TRIALS: 10,
  SLIDER_REPEAT_INTERVAL_MS: 300,
  OPENING_BAND_HZ: 1000,
  ASC_RUNS: 3,
  ASC_AGREE_DB: 3,
  ASC_PRACTICE_START_OFFSET_DB: 8,
  ASC_COARSE_START_OFFSET_DB: -10,
  ASC_FINE_START_OFFSET_DB: -4,
  ASC_COARSE_RAMP_DB_PER_BEEP: 2,
  ASC_RAMP_DB_PER_BEEP: 0.5,
  ASC_BEEP_INTERVAL_MS: 300,
  ASC_RUN_LEAD_IN_MS: 800,
  ASC_MAX_BEEPS_AT_MAX: 12,
  ASC_MAX_RUN_RESTARTS: 3,
  ASC_PATTERN_BEEPS: 1
};
const BUILD_ID = "2026-11-04 #25";
function buildTagHTML() { return ' <span class="small">build ' + esc(BUILD_ID) + "</span>"; }

/* ============================================================
   audio — Web Audio beeps, gain mapping, slider repeat loop.
   dbToGain is pure and also exposed to the engine.
   ============================================================ */
let audioCtx = null;
let liveOscillators = [];
function stopAllTones() {
  const live = liveOscillators;
  liveOscillators = [];
  for (const o of live) { try { o.stop(0); } catch (e) {} }
}
function ensureAudio() {
  if (typeof window === "undefined") return null;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
function dbToGain(db) {
  return CONFIG.MAX_GAIN * Math.pow(10, db / 20);
}
function playTone(freqHz, levelDb, logicalEar, beepCount, longSingle) {
  return new Promise((resolve) => {
    try {
      const ctx = ensureAudio();
      const dur = CONFIG.BEEP_DUR_MS / 1000;
      const ramp = CONFIG.RAMP_MS / 1000;
      const gap = CONFIG.GAP_MS / 1000;
      const singleDur = (beepCount === 1 && longSingle) ? CONFIG.LONG_TONE_MS / 1000 : dur;
      const totalDur = beepCount === 2 ? (dur + gap + dur) : singleDur;
      if (levelDb <= CONFIG.MIN_DB) { setTimeout(resolve, (totalDur + 0.15) * 1000); return; }
      if (!ctx) { setTimeout(resolve, (totalDur + 0.15) * 1000); return; }
      const peak = dbToGain(levelDb);
      const panVal = logicalEar === "L" ? -1 : (logicalEar === "C" ? 0 : 1);
      function scheduleBeep(t0, len) {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = freqHz;
        const gain = ctx.createGain();
        const n = 64;
        const curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          const t = (i / (n - 1)) * len;
          let w = 1;
          if (t < ramp) w = 0.5 * (1 - Math.cos(Math.PI * t / ramp));
          else if (t > len - ramp) { const tr = len - t; w = 0.5 * (1 - Math.cos(Math.PI * tr / ramp)); }
          curve[i] = Math.max(0.00001, peak * w);
        }
        gain.gain.setValueAtTime(0.00001, t0);
        gain.gain.setValueCurveAtTime(curve, t0, len);
        let out = gain;
        try {
          if (typeof ctx.createStereoPanner === "function") {
            const p = ctx.createStereoPanner();
            p.pan.value = panVal;
            gain.connect(p);
            out = p;
          } else if (typeof ctx.createChannelMerger === "function") {
            const merger = ctx.createChannelMerger(2);
            if (logicalEar === "C") { gain.connect(merger, 0, 0); gain.connect(merger, 0, 1); }
            else gain.connect(merger, 0, logicalEar === "L" ? 0 : 1);
            out = merger;
          }
        } catch (e) {}
        osc.connect(gain);
        out.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + len + 0.05);
        liveOscillators.push(osc);
        if (liveOscillators.length > 50) liveOscillators.splice(0, liveOscillators.length - 50);
      }
      const t0 = ctx.currentTime + 0.05;
      scheduleBeep(t0, singleDur);
      if (beepCount === 2) scheduleBeep(t0 + dur + gap, dur);
      setTimeout(resolve, (totalDur + 0.18) * 1000);
    } catch (e) { setTimeout(resolve, 500); }
  });
}
function warmSpeechVoices() {
  // Touch the voice list early so enumeration finishes during the session
  // instead of racing the done announcement (getVoices can start empty).
  try {
    if (typeof window === "undefined" || !window.speechSynthesis) return;
    const synth = window.speechSynthesis;
    if (typeof synth.getVoices === "function") synth.getVoices();
    if (synth.__hlWarmed) return;
    synth.__hlWarmed = true;
    const hook = function () { try { synth.getVoices(); } catch (e) {} };
    if (typeof synth.addEventListener === "function") { try { synth.addEventListener("voiceschanged", hook); } catch (e) {} }
    else if ("onvoiceschanged" in synth) { try { synth.onvoiceschanged = hook; } catch (e) {} }
  } catch (e) {}
}
function waitForSpeechVoices(timeoutMs) {
  return new Promise(function (resolve) {
    let done = false;
    function finish(v) { if (!done) { done = true; resolve(v); } }
    try {
      const synth = (typeof window !== "undefined") ? window.speechSynthesis : null;
      if (!synth || typeof synth.getVoices !== "function") { finish(false); return; }
      if ((synth.getVoices() || []).length) { finish(true); return; }
      const timer = setTimeout(function () { cleanup(); finish(((synth.getVoices() || []).length > 0)); }, timeoutMs);
      function onChange() { if (((synth.getVoices() || []).length > 0)) { cleanup(); finish(true); } }
      function cleanup() {
        try { clearTimeout(timer); } catch (e) {}
        try { if (typeof synth.removeEventListener === "function") synth.removeEventListener("voiceschanged", onChange); } catch (e) {}
        try { if (synth.onvoiceschanged === onChange) synth.onvoiceschanged = null; } catch (e) {}
      }
      if (typeof synth.addEventListener === "function") { try { synth.addEventListener("voiceschanged", onChange); } catch (e) { cleanup(); finish(false); } }
      else if ("onvoiceschanged" in synth) { try { synth.onvoiceschanged = onChange; } catch (e) { cleanup(); finish(false); } }
      else { cleanup(); finish(false); }
    } catch (e) { finish(false); }
  });
}
function speak(text) {
  // Attempt speech through the device's own voices. Returns "spoken",
  // "no-api", "no-voices", or "failed", and always logs the reason so a
  // chime fallback can be explained from the debug copy.
  try {
    if (typeof window === "undefined" || !window.speechSynthesis) { dlog("speech: unavailable (no speechSynthesis)"); return "no-api"; }
    const synth = window.speechSynthesis;
    if (typeof synth.speak !== "function" || typeof synth.getVoices !== "function") { dlog("speech: unavailable (no speak/getVoices)"); return "no-api"; }
    const voices = synth.getVoices() || [];
    if (!voices.length) { dlog("speech: unavailable (0 voices loaded)"); return "no-voices"; }
    const U = window.SpeechSynthesisUtterance || (typeof SpeechSynthesisUtterance !== "undefined" ? SpeechSynthesisUtterance : null);
    if (!U) { dlog("speech: unavailable (no utterance constructor)"); return "failed"; }
    const pick = voices.filter(function (v) { return v && v.localService && v.lang && String(v.lang).toLowerCase().indexOf("en") === 0; })[0] ||
      voices.filter(function (v) { return v && v.localService; })[0] || null;
    const u = new U(text);
    if (pick) u.voice = pick;
    u.rate = 1;
    let started = false, backedUp = false;
    function backup() {
      if (started || backedUp) return;
      backedUp = true;
      try { playSessionDoneCue(); } catch (e) {}
    }
    try { u.onstart = function () { started = true; }; } catch (e) {}
    try { u.onerror = backup; } catch (e) {}
    try { if (typeof synth.cancel === "function") synth.cancel(); } catch (e) {}
    synth.speak(u);
    try { setTimeout(backup, CONFIG.SPEECH_START_TIMEOUT_MS); } catch (e) {}
    dlog("speech: dispatched (" + (pick ? ((pick.name || "unnamed") + (pick.localService ? ", local" : ", remote")) : "default voice") + ")");
    return "spoken";
  } catch (e) { dlog("speech: threw (" + ((e && e.message) || e) + ")"); return "failed"; }
}
async function announceSessionDone() {
  warmSpeechVoices();
  let r = "failed";
  try { r = speak("Session complete."); } catch (e) { r = "failed"; }
  if (r === "no-voices") {
    try {
      const ready = await waitForSpeechVoices(CONFIG.SPEECH_VOICES_WAIT_MS);
      if (ready) { try { r = speak("Session complete."); } catch (e) { r = "failed"; } }
    } catch (e) {}
  }
  const spoken = (r === "spoken");
  if (!spoken) { try { playSessionDoneCue(); } catch (e) {} }
  try { dlog("done signal: " + (spoken ? "spoken (chime backup armed)" : "rising chime")); } catch (e) {}
  return spoken;
}
function playSessionDoneCue() {
  try {
    if (!ensureAudio()) return Promise.resolve();
    return playTone(660, -20, "C", 1, false)
      .then(function () { return playTone(880, -20, "C", 1, false); })
      .then(function () { return playTone(1320, -20, "C", 1, false); });
  } catch (e) { return Promise.resolve(); }
}
function startSliderLoop(freqHz, getLevelDb, logicalEar) {
  let stopped = false;
  let timer = null;
  async function beepOnce() {
    if (stopped) return;
    try { await playTone(freqHz, getLevelDb(), logicalEar, 1); } catch (e) {}
  }
  beepOnce();
  timer = setInterval(beepOnce, CONFIG.SLIDER_REPEAT_INTERVAL_MS);
  return function stop() { stopped = true; if (timer) clearInterval(timer); };
}

/* ============================================================
   state and storage — localStorage sessions + ear-swap setting.
   Nothing else is stored. Slider values never touch storage.
   ============================================================ */
const LS_SESSIONS = "hearingLog.sessions.v1";
const LS_SWAP = "hearingLog.earSwap.v1";
function loadSessions() {
  try {
    if (typeof localStorage === "undefined") return [];
    const raw = localStorage.getItem(LS_SESSIONS);
    if (!raw) return [];
    const a = JSON.parse(raw);
    return Array.isArray(a) ? a : [];
  } catch (e) { return []; }
}
function saveSessions(s) {
  try { if (typeof localStorage !== "undefined") localStorage.setItem(LS_SESSIONS, JSON.stringify(s)); } catch (e) {}
}
const LS_PROBE = "hearingLog.probe.v1";
let storageOK = true;
try {
  if (typeof localStorage === "undefined") storageOK = false;
  else { localStorage.setItem(LS_PROBE, "1"); localStorage.removeItem(LS_PROBE); }
} catch (e) { storageOK = false; }
function storageBannerHTML() {
  if (storageOK) return "";
  return '<div class="flag"><b>Browser storage is not working</b> — results <b>cannot be saved</b> here (private window, blocked site data, or an unusual file setup). Nothing will persist between visits. Use a normal browser window to keep your data.</div>';
}
function missingDataWarningHTML() {
  if (allSessions.length) return "";
  let suspicious = false;
  try { suspicious = loadBandChoice() !== null || loadStartSource() !== "last" || loadMode() !== "staircase"; } catch (e) {}
  if (!suspicious) return "";
  return '<div class="flag"><b>No saved sessions found — but your settings are still here.</b> Past data may have been cleared (browser data cleared, a different browser or profile, or the file moved). If you have measured before, go back to the original browser and file; otherwise carry on and this becomes your new home.</div>';
}
function loadEarSwap() {
  try { if (typeof localStorage === "undefined") return false; return localStorage.getItem(LS_SWAP) === "1"; }
  catch (e) { return false; }
}
function saveEarSwap(v) {
  try { if (typeof localStorage !== "undefined") localStorage.setItem(LS_SWAP, v ? "1" : "0"); } catch (e) {}
}
let earSwapCached = null;
function isEarSwapped() {
  if (earSwapCached === null) earSwapCached = loadEarSwap();
  return earSwapCached;
}
function setEarSwapped(v) { earSwapCached = v; saveEarSwap(v); }
const LS_SLIDER = "hearingLog.slider.v1";
function loadSliderProgress() {
  try {
    if (typeof localStorage === "undefined") return null;
    const raw = localStorage.getItem(LS_SLIDER);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !Array.isArray(o.runs) || !o.seeds) return null;
    return o;
  } catch (e) { return null; }
}
function saveSliderProgress(runs, seeds) {
  try {
    if (typeof localStorage === "undefined") return;
    localStorage.setItem(LS_SLIDER, JSON.stringify({ date: new Date().toISOString(), runs: runs, seeds: seeds }));
  } catch (e) {}
}
function clearSliderProgress() {
  try { if (typeof localStorage !== "undefined") localStorage.removeItem(LS_SLIDER); } catch (e) {}
}
const LS_BANDS = "hearingLog.bands.v1";
function loadBandChoice() {
  try {
    if (typeof localStorage === "undefined") return null;
    const raw = localStorage.getItem(LS_BANDS);
    if (!raw) return null;
    const a = JSON.parse(raw);
    if (!Array.isArray(a)) return null;
    return a.filter(function (b) { return CONFIG.BANDS_HZ.indexOf(b) >= 0; });
  } catch (e) { return null; }
}
function saveBandChoice(bands) {
  try {
    if (typeof localStorage === "undefined") return;
    localStorage.setItem(LS_BANDS, JSON.stringify(bands));
  } catch (e) {}
}
function bandPrecheck(noHearingBands) {
  const saved = loadBandChoice();
  const pre = {};
  for (const b of CONFIG.BANDS_HZ) {
    const dead = noHearingBands.indexOf(b) >= 0;
    pre[b] = saved ? (saved.indexOf(b) >= 0 && !dead) : !dead;
  }
  return pre;
}
const LS_STARTSRC = "hearingLog.startSource.v1";
function loadStartSource() {
  try {
    if (typeof localStorage === "undefined") return "last";
    return localStorage.getItem(LS_STARTSRC) === "sliders" ? "sliders" : "last";
  } catch (e) { return "last"; }
}
function saveStartSource(v) {
  try { if (typeof localStorage !== "undefined") localStorage.setItem(LS_STARTSRC, v === "sliders" ? "sliders" : "last"); } catch (e) {}
}
const LS_MODE = "hearingLog.mode.v1";
function loadMode() {
  try {
    if (typeof localStorage === "undefined") return "staircase";
    return localStorage.getItem(LS_MODE) === "ascending" ? "ascending" : "staircase";
  } catch (e) { return "staircase"; }
}
function saveMode(v) {
  try { if (typeof localStorage !== "undefined") localStorage.setItem(LS_MODE, v === "ascending" ? "ascending" : "staircase"); } catch (e) {}
}
const LS_HIST = "hearingLog.history.v1";
const HIST_DEFAULT_MONTHS = 0, HIST_MAX_MONTHS = 12;
function loadHistoryMonths() {
  try {
    if (typeof localStorage === "undefined") return HIST_DEFAULT_MONTHS;
    const raw = localStorage.getItem(LS_HIST);
    if (raw === null || raw === undefined || raw === "") return HIST_DEFAULT_MONTHS;
    const m = parseInt(raw, 10);
    if (isNaN(m)) return HIST_DEFAULT_MONTHS;
    return Math.max(0, Math.min(HIST_MAX_MONTHS, m));
  } catch (e) { return HIST_DEFAULT_MONTHS; }
}
function saveHistoryMonths(m) {
  try {
    if (typeof localStorage === "undefined") return;
    const v = parseInt(m, 10);
    localStorage.setItem(LS_HIST, String(isNaN(v) ? HIST_DEFAULT_MONTHS : Math.max(0, Math.min(HIST_MAX_MONTHS, v))));
  } catch (e) {}
}
function modeLabel(mode) { return mode === "ascending" ? "Ascending tone" : "Staircase"; }
function paintModeButtons(idStair, idAsc) {
  const m = loadMode();
  const bS = document.getElementById(idStair);
  const bA = document.getElementById(idAsc);
  if (bS) {
    bS.className = m === "staircase" ? "primary" : "quiet";
    bS.innerHTML = (m === "staircase" ? "✓ " : "") + "<b>Staircase (4FC)</b><br><small>which ear + which pattern</small>";
    if (bS.setAttribute) bS.setAttribute("aria-pressed", m === "staircase" ? "true" : "false");
  }
  if (bA) {
    bA.className = m === "ascending" ? "primary" : "quiet";
    bA.innerHTML = (m === "ascending" ? "✓ " : "") + "<b>Ascending tone ★ Recommended</b><br><small>rises until you tap the side</small>";
    if (bA.setAttribute) bA.setAttribute("aria-pressed", m === "ascending" ? "true" : "false");
  }
}
function sessionModeLabel(sess) { return modeLabel(sess && sess.mode ? sess.mode : "staircase"); }
const LS_DRAFT = "hearingLog.draft.v1";
function saveDraft(snapshot) {
  try {
    if (typeof localStorage === "undefined") return;
    snapshot.savedAt = new Date().toISOString();
    localStorage.setItem(LS_DRAFT, JSON.stringify(snapshot));
  } catch (e) {}
}
function loadDraft() {
  try {
    if (typeof localStorage === "undefined") return null;
    const raw = localStorage.getItem(LS_DRAFT);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.session || !Array.isArray(d.session.trials) || !Array.isArray(d.bands) || !d.bands.length) return null;
    if (typeof d.bandIndex !== "number" || !d.tracks || typeof d.tracks !== "object") return null;
    if (!d.beepCounts || !d.scheduler) return null;
    return d;
  } catch (e) { return null; }
}
function clearDraft() {
  try { if (typeof localStorage !== "undefined") localStorage.removeItem(LS_DRAFT); } catch (e) {}
}
function earLabel(logicalEar) {
  const s = isEarSwapped();
  if (!s) return logicalEar === "L" ? "Left" : "Right";
  return logicalEar === "L" ? "Right" : "Left";
}
function logicalForDisplayLabel(label) {
  const s = isEarSwapped();
  if (!s) return label === "Left" ? "L" : "R";
  return label === "Left" ? "R" : "L";
}
function displayEarCode(logicalEar) {
  return isEarSwapped() ? (logicalEar === "L" ? "R" : "L") : logicalEar;
}
function trackKey(band, ear) { return band + "|" + ear; }
let allSessions = [];
try { allSessions = loadSessions(); } catch (e) { allSessions = []; }

function showResetScreen() {
  const app = document.getElementById("app");
  stopActiveAudio();
  const nSess = allSessions.length;
  let nTrials = 0;
  for (const s of allSessions) nTrials += (s.trials ? s.trials.length : 0);
  const prog = loadSliderProgress();
  const nChecks = (prog && prog.seeds) ? Object.keys(prog.seeds).length : 0;
  app.innerHTML = topbar("") + "<h2>Reset everything?</h2>" +
    '<div class="flag"><b>This wipes the app back to scratch.</b> This browser holds <b>' + nSess + " session" + (nSess === 1 ? "" : "s") + " · " + nTrials + " trials · " + nChecks + " starting-point checks</b>. Deleting is permanent — there is no undo.</div>" +
    '<div class="card"><p>Tick every box to unlock the delete button:</p>' +
    '<p><label><input type="checkbox" id="resetCk1"> Delete all ' + nSess + " session" + (nSess === 1 ? "" : "s") + " and their trials</label></p>" +
    '<p><label><input type="checkbox" id="resetCk2"> Delete the starting-point checks</label></p>' +
    '<p><label><input type="checkbox" id="resetCk3"> Delete all settings and choices (method, pitches, ear labels)</label></p>' +
    '<p><label><input type="checkbox" id="resetCk4"> I understand nothing can be recovered</label></p>' +
    '<p><label><input type="checkbox" id="resetCk5"> I really want to start from scratch</label></p>' +
    '<div class="row"><button id="resetExportBtn" class="quiet">Export JSON first</button><button id="resetDeleteBtn" class="primary" disabled>Delete everything</button><button id="resetBackBtn" class="quiet">Cancel — keep my data</button></div></div>';
  const boxes = [1, 2, 3, 4, 5].map(function (i) { return document.getElementById("resetCk" + i); });
  const del = document.getElementById("resetDeleteBtn");
  function refresh() {
    const all = boxes.every(function (b) { return b && b.checked; });
    if (del) del.disabled = !all;
  }
  for (const b of boxes) { if (b) b.onchange = refresh; }
  refresh();
  const exp = document.getElementById("resetExportBtn");
  if (exp) exp.onclick = function () { downloadJson(); };
  const back = document.getElementById("resetBackBtn");
  if (back) back.onclick = function () { showHome(); };
  if (del) del.onclick = function () {
    if (del.disabled) return;
    resetAppState();
    showHome();
  };
}
